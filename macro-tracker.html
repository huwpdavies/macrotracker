<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Tracker</title>
    <style>
        :root {
            --bg: #FAF7F2;
            --surface: #FFFFFF;
            --surface2: #F2EDE6;
            --border: #E2D8CC;
            --text: #211B14;
            --muted: #8C7E72;
            --accent: #5CAF88;
            --accent-h: #4D9A76;
            --green: #3F9E6E;
            --yellow: #C49010;
            --red: #C94040;
            --orange: #C46520;
            --blue: #6FC49E;
            --purple: #9B7AD4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* NAV */
        nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; gap: 0.25rem; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-weight: 700; font-size: 1rem; color: var(--accent); margin-right: 1rem; white-space: nowrap; padding: 1rem 0; }
        .nav-tab { padding: 1rem 1.1rem; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.875rem; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
        .nav-tab:hover { color: var(--text); }
        .nav-tab.active { color: var(--text); border-bottom-color: var(--accent); }

        /* LAYOUT */
        main { max-width: 920px; margin: 0 auto; padding: 1.5rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* CARDS */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
        .card-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1rem; }

        /* MACRO GRID */
        .macro-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
        @media (max-width: 700px) { .macro-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 420px) { .macro-grid { grid-template-columns: repeat(2, 1fr); } }
        .macro-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; }
        .macro-card .m-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.3rem; }
        .macro-card .m-vals { display: flex; align-items: baseline; gap: 0.2rem; margin-bottom: 0.5rem; }
        .macro-card .m-cur { font-size: 1.35rem; font-weight: 700; line-height: 1; }
        .macro-card .m-target { font-size: 0.75rem; color: var(--muted); }
        .macro-card .m-remaining { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.4rem; }
        .m-remaining.over { color: var(--red); }
        .progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; max-width: 100%; }

        .c-cal { color: var(--yellow); } .f-cal { background: var(--yellow); }
        .c-pro { color: var(--blue); }  .f-pro { background: var(--blue); }
        .c-car { color: var(--orange); }.f-car { background: var(--orange); }
        .c-fat { color: var(--red); }   .f-fat { background: var(--red); }
        .c-fib { color: var(--green); } .f-fib { background: var(--green); }
        .over-bar .progress-fill { background: var(--red) !important; }

        /* DAY CONTROLS */
        .day-controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .date-nav { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .date-nav button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0.45rem 0.8rem; font-size: 0.875rem; line-height: 1; transition: all 0.1s; }
        .date-nav button:hover { background: var(--surface2); color: var(--text); }
        .date-display { font-size: 0.875rem; font-weight: 500; padding: 0 0.75rem; min-width: 150px; text-align: center; }
        .goal-pill { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.85rem; }
        .goal-pill label { font-size: 0.875rem; color: var(--muted); white-space: nowrap; }
        select { background: transparent; border: none; color: var(--text); font-size: 0.875rem; cursor: pointer; padding: 0; outline: none; }
        select option { background: var(--surface2); }

        /* BUTTONS */
        .btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; line-height: 1; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-h); }
        .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--border); }
        .btn-danger-ghost { background: transparent; color: var(--red); border: 1px solid #ECBCBC; }
        .btn-danger-ghost:hover { background: #FCEAEA; }
        .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.78rem; }
        .btn-xs { padding: 0.2rem 0.5rem; font-size: 0.72rem; }
        .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0.3rem 0.4rem; border-radius: 5px; font-size: 0.95rem; line-height: 1; transition: all 0.1s; }
        .icon-btn:hover { background: var(--surface2); color: var(--text); }

        /* LOG */
        .log-actions { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .log-entry { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.9rem; background: var(--surface2); border-radius: 9px; margin-bottom: 0.4rem; }
        .le-info { flex: 1; min-width: 0; }
        .le-name { font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .le-detail { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
        .le-macros { display: flex; gap: 0.85rem; flex-shrink: 0; }
        .mc { display: flex; flex-direction: column; align-items: center; }
        .mc .v { font-size: 0.8rem; font-weight: 600; }
        .mc .l { font-size: 0.62rem; color: var(--muted); }

        /* LIST ITEMS */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .section-title { font-size: 1.05rem; font-weight: 600; }
        .list-item { display: flex; align-items: center; padding: 0.8rem 0.9rem; background: var(--surface2); border-radius: 9px; margin-bottom: 0.4rem; gap: 0.75rem; }
        .li-info { flex: 1; min-width: 0; }
        .li-name { font-size: 0.875rem; font-weight: 500; }
        .li-detail { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; line-height: 1.5; }
        .li-actions { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; }

        /* BADGE */
        .badge { font-size: 0.62rem; padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; vertical-align: middle; margin-left: 0.4rem; }
        .badge-active { background: rgba(92,175,136,0.14); color: var(--accent); border: 1px solid rgba(92,175,136,0.35); }

        /* MODAL */
        .overlay { position: fixed; inset: 0; background: rgba(33,27,20,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto; }
        .modal-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.25rem; }
        .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }

        /* FORMS */
        .form-group { margin-bottom: 0.9rem; }
        .form-label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; }
        .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 0.75rem; border-radius: 8px; font-size: 0.875rem; outline: none; transition: border-color 0.15s; }
        .form-input:focus { border-color: var(--accent); }
        .macro-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }

        /* INGREDIENT BUILDER */
        .ing-row { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.4rem; }
        .ing-row select.form-input { flex: 1; }
        .ing-row input.form-input { width: 72px; flex-shrink: 0; }
        .macro-preview { font-size: 0.78rem; color: var(--muted); background: var(--surface2); border-radius: 7px; padding: 0.65rem 0.8rem; margin: 0.5rem 0; }

        /* SEARCH */
        .search-result { padding: 0.7rem 0.8rem; border-radius: 8px; cursor: pointer; transition: background 0.1s; margin-bottom: 0.3rem; }
        .search-result:hover { background: var(--surface2); }
        .search-result.selected { background: rgba(92,175,136,0.1); border: 1px solid rgba(92,175,136,0.3); }
        .sr-name { font-size: 0.875rem; font-weight: 500; }
        .sr-detail { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
        .search-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 9px; padding: 0.3rem; }

        /* MISC */
        .empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.875rem; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .hidden { display: none !important; }
        .today-btn { font-size: 0.875rem; padding: 0.45rem 0.85rem; background: var(--surface); }
        .today-btn:hover { background: var(--surface2); }

        /* ERROR SCREEN */
        .error-screen { text-align: center; padding: 5rem 2rem; color: var(--muted); }
        .error-screen h2 { font-size: 1.15rem; color: var(--text); margin-bottom: 0.75rem; }
        .error-screen p { font-size: 0.875rem; line-height: 1.7; max-width: 360px; margin: 0 auto 1rem; }
        .error-screen code { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.9rem; font-size: 0.85rem; color: var(--accent); }
    </style>
</head>
<body>

<nav>
    <span class="nav-brand">Macro Tracker</span>
    <button class="nav-tab active" data-tab="today" onclick="switchTab(this)">Today</button>
    <button class="nav-tab" data-tab="ingredients" onclick="switchTab(this)">Ingredients</button>
    <button class="nav-tab" data-tab="meals" onclick="switchTab(this)">Meals</button>
    <button class="nav-tab" data-tab="goals" onclick="switchTab(this)">Goals</button>
</nav>

<main>
    <!-- TODAY -->
    <div class="tab-content active" id="tab-today">
        <div class="day-controls">
            <div class="date-nav">
                <button onclick="shiftDate(-1)" title="Previous day">&#8249;</button>
                <span class="date-display" id="date-display"></span>
                <button onclick="shiftDate(1)" title="Next day">&#8250;</button>
            </div>
            <button class="btn btn-ghost btn-sm today-btn" onclick="goToday()">Today</button>
            <div class="goal-pill">
                <label>Goal:</label>
                <select id="goal-select" onchange="setActiveGoal(this.value)">
                    <option value="">None</option>
                </select>
            </div>
        </div>
        <div class="macro-grid" id="macro-summary"></div>
        <div class="card">
            <div class="card-title">Food Log</div>
            <div class="log-actions">
                <button class="btn btn-primary btn-sm" onclick="openAddFood()">+ Add Food</button>
                <button class="btn btn-ghost btn-sm" onclick="openAddMeal()">+ Add Meal</button>
            </div>
            <div id="log-list"></div>
        </div>
    </div>

    <!-- INGREDIENTS -->
    <div class="tab-content" id="tab-ingredients">
        <div class="section-header">
            <span class="section-title">Ingredients</span>
            <button class="btn btn-primary btn-sm" onclick="openIngredientForm()">+ New Ingredient</button>
        </div>
        <div id="ingredient-list"></div>
    </div>

    <!-- MEALS -->
    <div class="tab-content" id="tab-meals">
        <div class="section-header">
            <span class="section-title">Meals</span>
            <button class="btn btn-primary btn-sm" onclick="openMealForm()">+ New Meal</button>
        </div>
        <div id="meal-list"></div>
    </div>

    <!-- GOALS -->
    <div class="tab-content" id="tab-goals">
        <div class="section-header">
            <span class="section-title">Goals</span>
            <button class="btn btn-primary btn-sm" onclick="openGoalForm()">+ New Goal</button>
        </div>
        <div id="goal-list"></div>
    </div>
</main>

<!-- ── MODAL: Add Food ── -->
<div class="overlay hidden" id="m-add-food">
    <div class="modal">
        <div class="modal-title">Add Food to Log</div>
        <div class="form-group">
            <label class="form-label">Search ingredient</label>
            <input class="form-input" id="food-q" type="text" placeholder="Type to search…" autocomplete="off" oninput="filterFood()">
        </div>
        <div class="search-list" id="food-results"></div>
        <div id="food-amount-section" class="hidden">
            <hr class="divider">
            <div class="form-group">
                <label class="form-label">Amount (g)</label>
                <input class="form-input" id="food-amount" type="number" min="1" value="100" oninput="updateFoodPreview()">
            </div>
            <div class="macro-preview" id="food-preview"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal('m-add-food')">Cancel</button>
            <button class="btn btn-primary hidden" id="btn-confirm-food" onclick="confirmAddFood()">Add to Log</button>
        </div>
    </div>
</div>

<!-- ── MODAL: Add Meal ── -->
<div class="overlay hidden" id="m-add-meal">
    <div class="modal">
        <div class="modal-title">Add Meal to Log</div>
        <div id="meal-pick-list"></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal('m-add-meal')">Cancel</button>
        </div>
    </div>
</div>

<!-- ── MODAL: Ingredient Form ── -->
<div class="overlay hidden" id="m-ingredient">
    <div class="modal">
        <div class="modal-title" id="ing-title">New Ingredient</div>
        <input type="hidden" id="ing-id">
        <div class="form-group">
            <label class="form-label">Name</label>
            <input class="form-input" id="ing-name" type="text" placeholder="e.g. Chicken Breast">
        </div>
        <div class="form-group">
            <label class="form-label">Nutritional values are per (g)</label>
            <input class="form-input" id="ing-per" type="number" min="1" value="100">
        </div>
        <div class="macro-grid-2">
            <div class="form-group">
                <label class="form-label">Calories (kcal)</label>
                <input class="form-input" id="ing-cal" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Protein (g)</label>
                <input class="form-input" id="ing-pro" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Carbohydrates (g)</label>
                <input class="form-input" id="ing-car" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Fat (g)</label>
                <input class="form-input" id="ing-fat" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Fibre (g)</label>
                <input class="form-input" id="ing-fib" type="number" min="0" step="0.1">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal('m-ingredient')">Cancel</button>
            <button class="btn btn-primary" onclick="saveIngredient()">Save</button>
        </div>
    </div>
</div>

<!-- ── MODAL: Meal Form ── -->
<div class="overlay hidden" id="m-meal">
    <div class="modal">
        <div class="modal-title" id="meal-title">New Meal</div>
        <input type="hidden" id="meal-id">
        <div class="macro-grid-2">
            <div class="form-group">
                <label class="form-label">Meal Name</label>
                <input class="form-input" id="meal-name" type="text" placeholder="e.g. Chicken and Rice">
            </div>
            <div class="form-group">
                <label class="form-label">Servings this recipe makes</label>
                <input class="form-input" id="meal-servings" type="number" min="1" step="1" value="1" oninput="refreshMealPreview()">
            </div>
        </div>
        <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
                <label class="form-label" style="margin:0">Ingredients</label>
                <button class="btn btn-ghost btn-xs" onclick="addIngRow()">+ Add Ingredient</button>
            </div>
            <div id="ing-rows"></div>
        </div>
        <div class="macro-preview" id="meal-preview">No ingredients added yet.</div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal('m-meal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveMeal()">Save</button>
        </div>
    </div>
</div>

<!-- ── MODAL: Goal Form ── -->
<div class="overlay hidden" id="m-goal">
    <div class="modal">
        <div class="modal-title" id="goal-title">New Goal</div>
        <input type="hidden" id="goal-id">
        <div class="form-group">
            <label class="form-label">Goal Name</label>
            <input class="form-input" id="goal-name" type="text" placeholder="e.g. Lose Weight">
        </div>
        <div class="macro-grid-2">
            <div class="form-group">
                <label class="form-label">Calories (kcal)</label>
                <input class="form-input" id="goal-cal" type="number" min="0">
            </div>
            <div class="form-group">
                <label class="form-label">Protein (g)</label>
                <input class="form-input" id="goal-pro" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Carbohydrates (g)</label>
                <input class="form-input" id="goal-car" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Fat (g)</label>
                <input class="form-input" id="goal-fat" type="number" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label class="form-label">Fibre (g)</label>
                <input class="form-input" id="goal-fib" type="number" min="0" step="0.1">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal('m-goal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveGoal()">Save</button>
        </div>
    </div>
</div>

<script>
// ─── Utilities ────────────────────────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const r1  = n => Math.round(n * 10) / 10;
const ri  = n => Math.round(n);

function todayStr() {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
}

function dateLabel(str) {
    const d    = new Date(str + 'T00:00:00');
    const today = new Date(todayStr() + 'T00:00:00');
    const diff = Math.round((d - today) / 86400000);
    const date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    if (diff ===  0) return `Today &mdash; ${date}`;
    if (diff === -1) return `Yesterday &mdash; ${date}`;
    if (diff ===  1) return `Tomorrow &mdash; ${date}`;
    return `${d.toLocaleDateString('en-GB', { weekday: 'short' })} &mdash; ${date}`;
}

function calcIngMacros(ing, amount) {
    const f = amount / ing.per;
    return { calories: ing.calories*f, protein: ing.protein*f, carbs: ing.carbs*f, fat: ing.fat*f, fibre: ing.fibre*f };
}

// Returns per-serving macros, using stored values when available (populated on save)
// and falling back to dynamic calculation for meals saved before this was added.
function getMealMacros(meal) {
    if (meal.calories || meal.protein || meal.carbs || meal.fat || meal.fibre) {
        return { calories: meal.calories||0, protein: meal.protein||0, carbs: meal.carbs||0,
                 fat: meal.fat||0, fibre: meal.fibre||0 };
    }
    const total = calcMealMacros(meal);
    const s = meal.servings || 1;
    return { calories: total.calories/s, protein: total.protein/s, carbs: total.carbs/s,
             fat: total.fat/s, fibre: total.fibre/s };
}

function calcMealMacros(meal) {
    return (meal.ingredients || []).reduce((acc, mi) => {
        const ing = state.ingredients.find(i => i.id === mi.ingredientId);
        if (!ing) return acc;
        const m = calcIngMacros(ing, mi.amount);
        acc.calories += m.calories; acc.protein += m.protein;
        acc.carbs    += m.carbs;   acc.fat     += m.fat;   acc.fibre += m.fibre;
        return acc;
    }, { calories:0, protein:0, carbs:0, fat:0, fibre:0 });
}

function macroText(m) {
    return `${ri(m.calories)} kcal &nbsp;|&nbsp; P: ${r1(m.protein)}g &nbsp;|&nbsp; C: ${r1(m.carbs)}g &nbsp;|&nbsp; F: ${r1(m.fat)}g &nbsp;|&nbsp; Fb: ${r1(m.fibre)}g`;
}

// ─── State (in-memory cache, populated from API on load) ──────────────────────
const state = {
    ingredients: [],
    meals:       [],
    goals:       [],
    activeGoalId: '',
    entries:     [],   // log entries for curDate
};

// ─── API client ───────────────────────────────────────────────────────────────
const api = {
    async req(method, path, body) {
        const opts = { method, headers: {} };
        if (body !== undefined) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        const r = await fetch(path, opts);
        if (!r.ok) throw new Error(`${method} ${path} → ${r.status} ${r.statusText}`);
        return r.json();
    },
    get:  path       => api.req('GET',    path),
    post: (path, b)  => api.req('POST',   path, b),
    put:  (path, b)  => api.req('PUT',    path, b),
    del:  path       => api.req('DELETE', path),
};

// ─── Data loading ─────────────────────────────────────────────────────────────
async function loadAll() {
    const [ingredients, meals, goals, settings] = await Promise.all([
        api.get('/api/ingredients'),
        api.get('/api/meals'),
        api.get('/api/goals'),
        api.get('/api/settings'),
    ]);
    state.ingredients  = ingredients;
    state.meals        = meals;
    state.goals        = goals;
    state.activeGoalId = settings.activeGoalId || '';
}

async function loadLog(date) {
    state.entries = await api.get(`/api/log/${date}`);
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function switchTab(btn) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-' + tab).classList.add('active');
    if      (tab === 'today')       loadLog(curDate).then(renderToday);
    else if (tab === 'ingredients') renderIngredients();
    else if (tab === 'meals')       renderMeals();
    else if (tab === 'goals')       renderGoals();
}

// ─── Date ─────────────────────────────────────────────────────────────────────
let curDate = todayStr();

async function shiftDate(d) {
    const dt = new Date(curDate + 'T00:00:00');
    dt.setDate(dt.getDate() + d);
    curDate = [dt.getFullYear(), String(dt.getMonth()+1).padStart(2,'0'), String(dt.getDate()).padStart(2,'0')].join('-');
    await loadLog(curDate);
    renderToday();
}

async function goToday() {
    curDate = todayStr();
    await loadLog(curDate);
    renderToday();
}

// ─── Today ────────────────────────────────────────────────────────────────────
function renderToday() {
    document.getElementById('date-display').innerHTML = dateLabel(curDate);

    const sel = document.getElementById('goal-select');
    sel.innerHTML = '<option value="">None</option>' +
        state.goals.map(g => `<option value="${g.id}"${g.id === state.activeGoalId ? ' selected' : ''}>${g.name}</option>`).join('');

    const totals = state.entries.reduce((acc, e) => {
        acc.calories += e.calories||0; acc.protein += e.protein||0;
        acc.carbs    += e.carbs||0;   acc.fat     += e.fat||0;   acc.fibre += e.fibre||0;
        return acc;
    }, { calories:0, protein:0, carbs:0, fat:0, fibre:0 });

    const goal = state.goals.find(g => g.id === state.activeGoalId);

    const macros = [
        { key:'calories', label:'Calories', unit:'kcal', c:'c-cal', f:'f-cal' },
        { key:'protein',  label:'Protein',  unit:'g',    c:'c-pro', f:'f-pro' },
        { key:'carbs',    label:'Carbs',    unit:'g',    c:'c-car', f:'f-car' },
        { key:'fat',      label:'Fat',      unit:'g',    c:'c-fat', f:'f-fat' },
        { key:'fibre',    label:'Fibre',    unit:'g',    c:'c-fib', f:'f-fib' },
    ];

    document.getElementById('macro-summary').innerHTML = macros.map(m => {
        const cur  = totals[m.key];
        const tgt  = goal ? goal[m.key] : null;
        const pct  = tgt ? Math.min((cur / tgt) * 100, 100) : 0;
        const over = tgt && cur > tgt;
        const rem  = tgt ? (over ? `+${r1(cur - tgt)} over` : `${r1(tgt - cur)} left`) : '';
        return `<div class="macro-card">
            <div class="m-label">${m.label}</div>
            <div class="m-vals">
                <span class="m-cur ${m.c}">${m.key === 'calories' ? ri(cur) : r1(cur)}</span>
                <span class="m-target">${tgt ? '/ ' + tgt + ' ' + m.unit : m.unit}</span>
            </div>
            ${tgt ? `<div class="m-remaining${over ? ' over' : ''}">${rem}</div>` : ''}
            <div class="progress-bar${over ? ' over-bar' : ''}">
                <div class="progress-fill ${m.f}" style="width:${pct}%"></div>
            </div>
        </div>`;
    }).join('');

    const logEl = document.getElementById('log-list');
    if (!state.entries.length) {
        logEl.innerHTML = '<div class="empty">No food logged today. Add something to get started!</div>';
        return;
    }
    logEl.innerHTML = state.entries.map(e => `
        <div class="log-entry">
            <div class="le-info">
                <div class="le-name">${e.name}</div>
                <div class="le-detail">${e.detail}</div>
            </div>
            <div class="le-macros">
                <div class="mc"><span class="v c-cal">${ri(e.calories)}</span><span class="l">kcal</span></div>
                <div class="mc"><span class="v c-pro">${r1(e.protein)}</span><span class="l">pro</span></div>
                <div class="mc"><span class="v c-car">${r1(e.carbs)}</span><span class="l">carb</span></div>
                <div class="mc"><span class="v c-fat">${r1(e.fat)}</span><span class="l">fat</span></div>
                <div class="mc"><span class="v c-fib">${r1(e.fibre)}</span><span class="l">fibre</span></div>
            </div>
            <button class="icon-btn" onclick="removeEntry('${e.id}')" title="Remove">&#10005;</button>
        </div>
    `).join('');
}

async function setActiveGoal(id) {
    state.activeGoalId = id;
    await api.put('/api/settings', { activeGoalId: id });
    renderToday();
}

async function removeEntry(id) {
    await api.del(`/api/log/entry/${id}`);
    state.entries = state.entries.filter(e => e.id !== id);
    renderToday();
}

// ─── Add Food ─────────────────────────────────────────────────────────────────
let selIng = null;

function openAddFood() {
    selIng = null;
    document.getElementById('food-q').value = '';
    document.getElementById('food-amount').value = '100';
    document.getElementById('food-amount-section').classList.add('hidden');
    document.getElementById('btn-confirm-food').classList.add('hidden');
    filterFood();
    openModal('m-add-food');
    setTimeout(() => document.getElementById('food-q').focus(), 60);
}

function filterFood() {
    const q   = document.getElementById('food-q').value.toLowerCase();
    const ings = state.ingredients.filter(i => i.name.toLowerCase().includes(q));
    const el  = document.getElementById('food-results');
    if (!ings.length) {
        el.innerHTML = '<div class="empty" style="padding:0.75rem">No ingredients found</div>';
        return;
    }
    el.innerHTML = ings.map(i =>
        `<div class="search-result${selIng?.id === i.id ? ' selected' : ''}" onclick="pickIng('${i.id}')">
            <div class="sr-name">${i.name}</div>
            <div class="sr-detail">Per ${i.per}g &nbsp;|&nbsp; ${i.calories} kcal &nbsp;|&nbsp; P:${i.protein}g C:${i.carbs}g F:${i.fat}g Fb:${i.fibre}g</div>
        </div>`
    ).join('');
}

function pickIng(id) {
    selIng = state.ingredients.find(i => i.id === id);
    document.getElementById('food-q').value = selIng.name;
    document.getElementById('food-amount-section').classList.remove('hidden');
    document.getElementById('btn-confirm-food').classList.remove('hidden');
    filterFood();
    updateFoodPreview();
    document.getElementById('food-amount').focus();
    document.getElementById('food-amount').select();
}

function updateFoodPreview() {
    if (!selIng) return;
    const amount = parseFloat(document.getElementById('food-amount').value) || 0;
    const m = calcIngMacros(selIng, amount);
    document.getElementById('food-preview').innerHTML = `${amount}g &rarr; ${macroText(m)}`;
}

async function confirmAddFood() {
    if (!selIng) return;
    const amount = parseFloat(document.getElementById('food-amount').value) || 0;
    if (amount <= 0) { alert('Enter a valid amount.'); return; }
    const m = calcIngMacros(selIng, amount);
    await addToLog({ name: selIng.name, detail: `${amount}g`, ...m });
    closeModal('m-add-food');
}

// ─── Add Meal ─────────────────────────────────────────────────────────────────
function openAddMeal() {
    const el = document.getElementById('meal-pick-list');
    if (!state.meals.length) {
        el.innerHTML = '<div class="empty">No saved meals yet. Create some in the Meals tab!</div>';
    } else {
        el.innerHTML = state.meals.map(m => {
            const perServ  = getMealMacros(m);
            const servings = m.servings || 1;
            const servingLabel = servings > 1 ? ` (1 of ${servings} servings)` : '';
            return `<div class="list-item" style="cursor:pointer" onclick="pickMeal('${m.id}')">
                <div class="li-info">
                    <div class="li-name">${m.name}<span style="font-weight:400;color:var(--muted);font-size:0.8rem"> ${servingLabel}</span></div>
                    <div class="li-detail">${macroText(perServ)}</div>
                </div>
                <span style="color:var(--accent);font-size:0.8rem">Add &rarr;</span>
            </div>`;
        }).join('');
    }
    openModal('m-add-meal');
}

async function pickMeal(id) {
    const meal = state.meals.find(m => m.id === id);
    if (!meal) return;
    const perServ = getMealMacros(meal);
    const servings = meal.servings || 1;
    const detail = (meal.ingredients || [])
        .map(mi => { const i = state.ingredients.find(x => x.id === mi.ingredientId); return i ? `${i.name} (${mi.amount}g)` : null; })
        .filter(Boolean).join(', ');
    const label = servings > 1 ? `${meal.name} (1 serving of ${servings})` : meal.name;
    await addToLog({ name: label, detail, ...perServ });
    closeModal('m-add-meal');
}

// ─── Log ──────────────────────────────────────────────────────────────────────
async function addToLog(entry) {
    const e = { id: uid(), ...entry };
    await api.post(`/api/log/${curDate}`, e);
    state.entries.push(e);
    renderToday();
}

// ─── Ingredients ──────────────────────────────────────────────────────────────
function renderIngredients() {
    const el = document.getElementById('ingredient-list');
    if (!state.ingredients.length) {
        el.innerHTML = '<div class="empty">No ingredients saved yet. Add your first one!</div>';
        return;
    }
    el.innerHTML = state.ingredients.map(i => `
        <div class="list-item">
            <div class="li-info">
                <div class="li-name">${i.name}</div>
                <div class="li-detail">Per ${i.per}g &nbsp;|&nbsp; ${i.calories} kcal &nbsp;|&nbsp; Protein: ${i.protein}g &nbsp;|&nbsp; Carbs: ${i.carbs}g &nbsp;|&nbsp; Fat: ${i.fat}g &nbsp;|&nbsp; Fibre: ${i.fibre}g</div>
            </div>
            <div class="li-actions">
                <button class="icon-btn" onclick="openIngredientForm('${i.id}')" title="Edit">&#9998;</button>
                <button class="icon-btn" onclick="deleteIngredient('${i.id}')" title="Delete">&#128465;</button>
            </div>
        </div>
    `).join('');
}

function openIngredientForm(id) {
    const ing = id ? state.ingredients.find(i => i.id === id) : null;
    document.getElementById('ing-title').textContent = ing ? 'Edit Ingredient' : 'New Ingredient';
    document.getElementById('ing-id').value  = ing?.id       || '';
    document.getElementById('ing-name').value = ing?.name    || '';
    document.getElementById('ing-per').value  = ing?.per     ?? 100;
    document.getElementById('ing-cal').value  = ing?.calories ?? '';
    document.getElementById('ing-pro').value  = ing?.protein  ?? '';
    document.getElementById('ing-car').value  = ing?.carbs    ?? '';
    document.getElementById('ing-fat').value  = ing?.fat      ?? '';
    document.getElementById('ing-fib').value  = ing?.fibre    ?? '';
    openModal('m-ingredient');
    setTimeout(() => document.getElementById('ing-name').focus(), 60);
}

async function saveIngredient() {
    const id   = document.getElementById('ing-id').value;
    const name = document.getElementById('ing-name').value.trim();
    if (!name) { alert('Please enter a name.'); return; }
    const ing = {
        id: id || uid(), name,
        per:      parseFloat(document.getElementById('ing-per').value) || 100,
        calories: parseFloat(document.getElementById('ing-cal').value) || 0,
        protein:  parseFloat(document.getElementById('ing-pro').value) || 0,
        carbs:    parseFloat(document.getElementById('ing-car').value) || 0,
        fat:      parseFloat(document.getElementById('ing-fat').value) || 0,
        fibre:    parseFloat(document.getElementById('ing-fib').value) || 0,
    };
    if (id) {
        await api.put(`/api/ingredients/${id}`, ing);
    } else {
        await api.post('/api/ingredients', ing);
    }
    state.ingredients = await api.get('/api/ingredients');
    closeModal('m-ingredient');
    renderIngredients();
}

async function deleteIngredient(id) {
    if (!confirm('Delete this ingredient?')) return;
    await api.del(`/api/ingredients/${id}`);
    state.ingredients = state.ingredients.filter(i => i.id !== id);
    renderIngredients();
}

// ─── Meals ────────────────────────────────────────────────────────────────────
function renderMeals() {
    const el = document.getElementById('meal-list');
    if (!state.meals.length) {
        el.innerHTML = '<div class="empty">No saved meals yet. Build your first one!</div>';
        return;
    }
    el.innerHTML = state.meals.map(m => {
        const perServ  = getMealMacros(m);
        const servings = m.servings || 1;
        const detail = (m.ingredients || [])
            .map(mi => { const i = state.ingredients.find(x => x.id === mi.ingredientId); return i ? `${i.name} (${mi.amount}g)` : '?'; })
            .join(', ');
        const servingLabel = servings > 1 ? ` &mdash; ${servings} servings` : '';
        return `<div class="list-item">
            <div class="li-info">
                <div class="li-name">${m.name}<span style="font-weight:400;color:var(--muted)">${servingLabel}</span></div>
                <div class="li-detail">${detail || 'No ingredients'}</div>
                <div class="li-detail" style="margin-top:0.2rem">Per serving: ${macroText(perServ)}</div>
            </div>
            <div class="li-actions">
                <button class="icon-btn" onclick="openMealForm('${m.id}')" title="Edit">&#9998;</button>
                <button class="icon-btn" onclick="deleteMeal('${m.id}')" title="Delete">&#128465;</button>
            </div>
        </div>`;
    }).join('');
}

function openMealForm(id) {
    const meal = id ? state.meals.find(m => m.id === id) : null;
    document.getElementById('meal-title').textContent    = meal ? 'Edit Meal' : 'New Meal';
    document.getElementById('meal-id').value             = meal?.id       || '';
    document.getElementById('meal-name').value           = meal?.name     || '';
    document.getElementById('meal-servings').value       = meal?.servings ?? 1;
    const rows = document.getElementById('ing-rows');
    rows.innerHTML = '';
    if (meal?.ingredients?.length) {
        meal.ingredients.forEach(mi => addIngRow(mi.ingredientId, mi.amount));
    } else {
        addIngRow();
    }
    refreshMealPreview();
    openModal('m-meal');
    setTimeout(() => document.getElementById('meal-name').focus(), 60);
}

function addIngRow(ingredientId, amount) {
    const opts = state.ingredients
        .map(i => `<option value="${i.id}"${i.id === ingredientId ? ' selected' : ''}>${i.name}</option>`)
        .join('');
    const row = document.createElement('div');
    row.className = 'ing-row';
    row.innerHTML = `
        <select class="form-input" onchange="refreshMealPreview()">
            <option value="">Select ingredient…</option>${opts}
        </select>
        <input class="form-input" type="number" min="1" value="${amount || ''}" placeholder="g" oninput="refreshMealPreview()">
        <button class="icon-btn" onclick="this.parentElement.remove();refreshMealPreview()" title="Remove">&#10005;</button>
    `;
    document.getElementById('ing-rows').appendChild(row);
}

function refreshMealPreview() {
    const tot = { calories:0, protein:0, carbs:0, fat:0, fibre:0 };
    document.querySelectorAll('#ing-rows .ing-row').forEach(r => {
        const id  = r.querySelector('select').value;
        const amt = parseFloat(r.querySelector('input').value) || 0;
        const ing = state.ingredients.find(i => i.id === id);
        if (!ing || !amt) return;
        const m = calcIngMacros(ing, amt);
        tot.calories += m.calories; tot.protein += m.protein;
        tot.carbs    += m.carbs;   tot.fat     += m.fat;   tot.fibre += m.fibre;
    });
    const servings = Math.max(1, parseFloat(document.getElementById('meal-servings').value) || 1);
    const perServ  = { calories: tot.calories/servings, protein: tot.protein/servings,
                       carbs: tot.carbs/servings, fat: tot.fat/servings, fibre: tot.fibre/servings };
    const preview  = document.getElementById('meal-preview');
    if (servings === 1) {
        preview.innerHTML = `Per serving: ${macroText(tot)}`;
    } else {
        preview.innerHTML =
            `Total (${servings} servings): ${macroText(tot)}<br>
             <strong>Per serving:</strong> ${macroText(perServ)}`;
    }
}

async function saveMeal() {
    const id   = document.getElementById('meal-id').value;
    const name = document.getElementById('meal-name').value.trim();
    if (!name) { alert('Please enter a meal name.'); return; }
    const ingredients = [];
    document.querySelectorAll('#ing-rows .ing-row').forEach(r => {
        const ingredientId = r.querySelector('select').value;
        const amount       = parseFloat(r.querySelector('input').value) || 0;
        if (ingredientId && amount > 0) ingredients.push({ ingredientId, amount });
    });
    const servings = Math.max(1, parseFloat(document.getElementById('meal-servings').value) || 1);
    const tot = { calories:0, protein:0, carbs:0, fat:0, fibre:0 };
    ingredients.forEach(mi => {
        const ing = state.ingredients.find(i => i.id === mi.ingredientId);
        if (!ing) return;
        const m = calcIngMacros(ing, mi.amount);
        tot.calories += m.calories; tot.protein += m.protein;
        tot.carbs    += m.carbs;   tot.fat     += m.fat;   tot.fibre += m.fibre;
    });
    const meal = {
        id: id || uid(), name, servings,
        calories: tot.calories / servings, protein: tot.protein / servings,
        carbs:    tot.carbs    / servings, fat:     tot.fat     / servings,
        fibre:    tot.fibre    / servings,
        ingredients,
    };
    if (id) {
        await api.put(`/api/meals/${id}`, meal);
    } else {
        await api.post('/api/meals', meal);
    }
    state.meals = await api.get('/api/meals');
    closeModal('m-meal');
    renderMeals();
}

async function deleteMeal(id) {
    if (!confirm('Delete this meal?')) return;
    await api.del(`/api/meals/${id}`);
    state.meals = state.meals.filter(m => m.id !== id);
    renderMeals();
}

// ─── Goals ────────────────────────────────────────────────────────────────────
function renderGoals() {
    const el = document.getElementById('goal-list');
    if (!state.goals.length) {
        el.innerHTML = '<div class="empty">No goals set yet. Create one to start tracking progress!</div>';
        return;
    }
    el.innerHTML = state.goals.map(g => `
        <div class="list-item">
            <div class="li-info">
                <div class="li-name">${g.name}${g.id === state.activeGoalId ? '<span class="badge badge-active">Active</span>' : ''}</div>
                <div class="li-detail">${g.calories} kcal &nbsp;|&nbsp; Protein: ${g.protein}g &nbsp;|&nbsp; Carbs: ${g.carbs}g &nbsp;|&nbsp; Fat: ${g.fat}g &nbsp;|&nbsp; Fibre: ${g.fibre}g</div>
            </div>
            <div class="li-actions">
                ${g.id !== state.activeGoalId ? `<button class="btn btn-ghost btn-xs" onclick="activateGoal('${g.id}')">Set Active</button>` : ''}
                <button class="icon-btn" onclick="openGoalForm('${g.id}')" title="Edit">&#9998;</button>
                <button class="icon-btn" onclick="deleteGoal('${g.id}')" title="Delete">&#128465;</button>
            </div>
        </div>
    `).join('');
}

function openGoalForm(id) {
    const g = id ? state.goals.find(g => g.id === id) : null;
    document.getElementById('goal-title').textContent = g ? 'Edit Goal' : 'New Goal';
    document.getElementById('goal-id').value  = g?.id       || '';
    document.getElementById('goal-name').value = g?.name    || '';
    document.getElementById('goal-cal').value  = g?.calories ?? '';
    document.getElementById('goal-pro').value  = g?.protein  ?? '';
    document.getElementById('goal-car').value  = g?.carbs    ?? '';
    document.getElementById('goal-fat').value  = g?.fat      ?? '';
    document.getElementById('goal-fib').value  = g?.fibre    ?? '';
    openModal('m-goal');
    setTimeout(() => document.getElementById('goal-name').focus(), 60);
}

async function saveGoal() {
    const id   = document.getElementById('goal-id').value;
    const name = document.getElementById('goal-name').value.trim();
    if (!name) { alert('Please enter a goal name.'); return; }
    const g = {
        id: id || uid(), name,
        calories: parseFloat(document.getElementById('goal-cal').value) || 0,
        protein:  parseFloat(document.getElementById('goal-pro').value) || 0,
        carbs:    parseFloat(document.getElementById('goal-car').value) || 0,
        fat:      parseFloat(document.getElementById('goal-fat').value) || 0,
        fibre:    parseFloat(document.getElementById('goal-fib').value) || 0,
    };
    if (id) {
        await api.put(`/api/goals/${id}`, g);
        state.goals = state.goals.map(x => x.id === id ? g : x);
    } else {
        await api.post('/api/goals', g);
        state.goals = [...state.goals, g];
        if (state.goals.length === 1) {
            state.activeGoalId = g.id;
            await api.put('/api/settings', { activeGoalId: g.id });
        }
    }
    closeModal('m-goal');
    renderGoals();
}

async function deleteGoal(id) {
    if (!confirm('Delete this goal?')) return;
    await api.del(`/api/goals/${id}`);
    state.goals = state.goals.filter(g => g.id !== id);
    if (state.activeGoalId === id) {
        state.activeGoalId = state.goals[0]?.id || '';
        await api.put('/api/settings', { activeGoalId: state.activeGoalId });
    }
    renderGoals();
    renderToday();
}

async function activateGoal(id) {
    state.activeGoalId = id;
    await api.put('/api/settings', { activeGoalId: id });
    renderGoals();
    renderToday();
}

// ─── Modal helpers ────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

document.querySelectorAll('.overlay').forEach(o =>
    o.addEventListener('click', e => { if (e.target === o) o.classList.add('hidden'); })
);
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
async function init() {
    try {
        await loadAll();
        await loadLog(curDate);
        renderToday();
    } catch {
        document.querySelector('main').innerHTML = `
            <div class="error-screen">
                <h2>Cannot connect to server</h2>
                <p>The app needs the Python server running to load and save data. Start it with:</p>
                <code>python server.py</code>
                <p style="margin-top:1rem">Then refresh this page at <strong>http://localhost:5000</strong></p>
            </div>`;
    }
}
init();
</script>
</body>
</html>

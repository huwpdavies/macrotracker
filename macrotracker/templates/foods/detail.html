{% extends "base.html" %}
{% block title %}{{ food.name }} · Macro Tracker{% endblock %}
{% block content %}
  {% set editing = False %}
  {% include "foods/_sheet.html" %}

  <p>
    <a class="button" href="{{ url_for('foods.edit', food_id=food.id) }}">Edit</a>
    <form method="post" action="{{ url_for('foods.delete', food_id=food.id) }}" class="inline"
          onsubmit="return confirm('Delete {{ food.name|replace("'", "") }}?')">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="button danger">Delete</button>
    </form>
  </p>
  <p><a href="{{ url_for('foods.index') }}">← All foods</a></p>
{% endblock %}

{# One ingredient line in the builder. Expects `row` (key, food, amount, mode). The food box searches
   the <datalist id="food-options"> on the page as you type. #}
<div class="item-row">
  <input type="hidden" name="item_key" value="{{ row.key }}">
  <input type="text" name="item_food" value="{{ row.food }}" list="food-options" placeholder="Search foods"
         autocomplete="off" aria-label="Food" class="item-food">
  <input type="number" name="item_amount" value="{{ row.amount }}" min="0" step="any"
         inputmode="decimal" aria-label="Amount" class="item-amount">
  <select name="item_mode" aria-label="Amount is in" class="item-mode">
    <option value="servings" {{ 'selected' if row.mode == 'servings' }}>servings</option>
    <option value="amount" {{ 'selected' if row.mode == 'amount' }}>amount</option>
  </select>
  <button type="button" class="icon-btn item-remove" aria-label="Remove ingredient" title="Remove"
          hx-on:click="var d = this.closest('#build-fields'); this.closest('.item-row').remove(); htmx.trigger(d, 'input');">✕</button>
  {% include "partials/_item_macros.html" %}
</div>

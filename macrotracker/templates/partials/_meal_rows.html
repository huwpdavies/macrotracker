{% if meals %}
  <ul class="rows">
    {% for meal in meals %}
      {% set ps = per_serving[meal.id] %}
      <li>
        <button type="button" class="star{{ ' on' if meal.is_favourite }}"
                hx-post="{{ url_for('meals.favourite', meal_id=meal.id) }}" hx-target="#meal-list"
                aria-label="{{ 'Remove from favourites' if meal.is_favourite else 'Add to favourites' }}"
                title="{{ 'Unfavourite' if meal.is_favourite else 'Favourite' }}">{{ '★' if meal.is_favourite else '☆' }}</button>
        <div class="grow">
          <a href="{{ url_for('meals.detail', meal_id=meal.id) }}" class="row-title">{{ meal.name }}</a>
          <span class="row-meta">{{ ps.calories_kcal|num(0) }} kcal · {{ ps.protein_g|num }} g protein</span>
        </div>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="muted">No meals yet. <a href="{{ url_for('meals.new') }}">Build your first meal</a>.</p>
{% endif %}

[project]
name = "macrotracker"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime dependencies for Vercel. Keep in step with requirements.txt (which also has pytest for local use).
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-WTF==1.3.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
]

[tool.vercel]
entrypoint = "app:app"
